name: Docker build

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/**
      - examples/vhdl/**
      - .dockerignore
      - .github/workflows/docker-*.yml
  pull_request:
    paths:
      - Dockerfile
      - scripts/**
      - examples/vhdl/**
      - .dockerignore
      - .github/workflows/docker-*.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GHDL (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            cache: ghdl-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            cache: ghdl-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: docker-ghdl:check
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}
      - name: Check tools and run VHDL example tests
        run: ./scripts/test.sh docker-ghdl:check
